<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>متجر الهواتف</title>
<style>body{font-family:sans-serif;margin:0;background:#f4f1f8}header{background:#6b3fa0;color:#fff;padding:12px;text-align:center}
main{padding:12px;max-width:700px;margin:auto}.card,form{background:#fff;border-radius:10px;padding:10px;margin:10px 0;box-shadow:0 1px 4px #0002}
.card img{width:100%;max-height:220px;object-fit:cover;border-radius:8px}button{background:#6b3fa0;color:#fff;border:0;border-radius:8px;padding:8px 12px;margin:3px}
button.red{background:#c0392b}input,textarea{width:100%;box-sizing:border-box;margin:4px 0;padding:8px}h3{margin:6px 0}</style></head>
<body><header><b>متجر الهواتف على Pi</b> <span id="me"></span></header><main>
<form id="add"><h3>إضافة منتج</h3><input name="title" placeholder="اسم الهاتف" required maxlength="80">
<input name="price" type="number" step="0.01" min="0.01" placeholder="السعر بـ Pi" required>
<textarea name="desc" placeholder="الوصف والحالة" maxlength="500"></textarea>
<input name="image" type="file" accept="image/jpeg,image/png,image/webp" required><button>نشر</button></form>
<h3>المنتجات</h3><div id="list"></div><h3>طلباتي</h3><div id="orders"></div></main>
<script src="https://sdk.minepi.com/pi-sdk.js"></script><script src="app.js"></script></body></html>
